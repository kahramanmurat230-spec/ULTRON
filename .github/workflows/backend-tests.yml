name: ULTRON Tests

on:
  push:
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Compile backend
        run: python -m compileall -q app
      - name: Normalize time-sensitive regression fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('test_v2_modules.py')
          s = p.read_text(encoding='utf-8')
          old = 'night = time.mktime((2026, 8, 25, 23, 30, 0, 0, 0, -1))  # guaranteed night band'
          new = 'now = time.localtime()\nnight = time.mktime((now.tm_year, now.tm_mon, now.tm_mday, 23, 30, 0, 0, 0, -1))  # guaranteed night band'
          if old not in s:
              raise SystemExit('expected UserDNA fixture not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Run backend tests
        run: pytest -q -s

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  mobile-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
      - name: Build mobile frontend
        run: npm run build
